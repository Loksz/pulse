<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#0d0c16"/>
      <stop offset="100%" style="stop-color:#0f1018"/>
    </linearGradient>
    <radialGradient id="left-haze" cx="14%" cy="52%" r="38%">
      <stop offset="0%"   style="stop-color:#7c3aed;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="right-haze" cx="96%" cy="100%" r="55%">
      <stop offset="0%"   style="stop-color:#6d28d9;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#a78bfa"/>
      <stop offset="60%"  style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#f1f5f9"/>
      <stop offset="65%"  style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#left-haze)"/>
  <rect width="1200" height="280" fill="url(#right-haze)"/>

  <!-- Grid -->
  <g stroke="#8b5cf6" stroke-width="0.6" opacity="0.05">
    <line x1="0"   y1="40"  x2="1200" y2="40"/>
    <line x1="0"   y1="80"  x2="1200" y2="80"/>
    <line x1="0"   y1="120" x2="1200" y2="120"/>
    <line x1="0"   y1="160" x2="1200" y2="160"/>
    <line x1="0"   y1="200" x2="1200" y2="200"/>
    <line x1="0"   y1="240" x2="1200" y2="240"/>
    <line x1="40"  y1="0"   x2="40"   y2="280"/>
    <line x1="80"  y1="0"   x2="80"   y2="280"/>
    <line x1="120" y1="0"   x2="120"  y2="280"/>
    <line x1="160" y1="0"   x2="160"  y2="280"/>
    <line x1="200" y1="0"   x2="200"  y2="280"/>
    <line x1="240" y1="0"   x2="240"  y2="280"/>
  </g>

  <!-- Scattered background dots -->
  <g fill="#8b5cf6" opacity="0.08">
    <circle cx="500" cy="55"  r="1.8"/>
    <circle cx="555" cy="190" r="1.5"/>
    <circle cx="610" cy="105" r="2"/>
    <circle cx="650" cy="48"  r="1.5"/>
    <circle cx="695" cy="218" r="1.8"/>
    <circle cx="740" cy="132" r="1.5"/>
    <circle cx="530" cy="238" r="1"/>
    <circle cx="720" cy="64"  r="1"/>
    <circle cx="800" cy="175" r="1.5"/>
    <circle cx="840" cy="88"  r="1"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="280" fill="url(#accent-bar)"/>

  <!-- Logo box -->
  <g transform="translate(50, 94)">
    <rect width="92" height="92" rx="14"
          fill="#100d1e" stroke="#8b5cf6" stroke-width="1.5" opacity="0.92"/>
    <!-- Signal arcs (origin at 22, 72) -->
    <path d="M 22,55 A 17,17 0 0 1 39,72"
          fill="none" stroke="#8b5cf6" stroke-width="2.6"
          stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 22,41 A 31,31 0 0 1 53,72"
          fill="none" stroke="#8b5cf6" stroke-width="2"
          stroke-linecap="round" filter="url(#glow-sm)" opacity="0.72"/>
    <path d="M 22,26 A 46,46 0 0 1 68,72"
          fill="none" stroke="#8b5cf6" stroke-width="1.5"
          stroke-linecap="round" opacity="0.42"/>
    <circle cx="22" cy="72" r="4" fill="#8b5cf6" filter="url(#glow)"/>
  </g>

  <!-- Title -->
  <text
    x="166" y="150"
    font-family="'Courier New', Courier, monospace"
    font-size="68" font-weight="700" letter-spacing="10"
    fill="url(#title-grad)"
    filter="url(#glow)"
  >PULSE</text>

  <!-- Accent underline for title -->
  <rect x="168" y="160" width="330" height="2" rx="1" fill="#8b5cf6" opacity="0.55"/>

  <!-- Tagline -->
  <text
    x="168" y="187"
    font-family="'Courier New', Courier, monospace"
    font-size="13" letter-spacing="1.5" fill="#64748b"
  >HTTP monitoring  /  configurable assertions  /  real-time alerts</text>

  <!-- Decorative signal arcs from bottom-right (origin 1150, 280) -->
  <!-- Arc 1 - innermost -->
  <path d="M 1070,280 A 80,80 0 0 1 1150,200"
        fill="none" stroke="#8b5cf6" stroke-width="1.4"
        stroke-linecap="round" opacity="0.30" filter="url(#glow-sm)"/>
  <!-- Arc 2 -->
  <path d="M 1000,280 A 150,150 0 0 1 1150,130"
        fill="none" stroke="#8b5cf6" stroke-width="1.2"
        stroke-linecap="round" opacity="0.22"/>
  <!-- Arc 3 -->
  <path d="M 930,280 A 220,220 0 0 1 1150,60"
        fill="none" stroke="#8b5cf6" stroke-width="1"
        stroke-linecap="round" opacity="0.15"/>
  <!-- Arc 4 -->
  <path d="M 860,280 A 290,290 0 0 1 1150,-10"
        fill="none" stroke="#8b5cf6" stroke-width="0.8"
        stroke-linecap="round" opacity="0.09"/>
  <!-- Arc 5 - outermost -->
  <path d="M 780,280 A 370,370 0 0 1 1150,-90"
        fill="none" stroke="#8b5cf6" stroke-width="0.6"
        stroke-linecap="round" opacity="0.05"/>

  <!-- Origin dot -->
  <circle cx="1150" cy="280" r="4" fill="#8b5cf6" opacity="0.25" filter="url(#glow-sm)"/>
</svg>
